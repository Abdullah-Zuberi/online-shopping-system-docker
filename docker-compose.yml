version: '3.8'

services:
  web:
    build: .
    ports:
      - "80:80"
    depends_on:
      - db

  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: onlineshop
    volumes:
      - ./database/onlineshop.sql:/docker-entrypoint-initdb.d/onlineshop.sql
      - db_data:/var/lib/mysql

volumes:
  db_data:
